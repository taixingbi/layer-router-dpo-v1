[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layer-router-train-v1"
version = "0.1.0"
description = "QLoRA DPO and SFT training for HuntAI intent router (offline GPU batch job)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2.0,<2.6.0",
  "transformers>=4.44.0,<4.49.0",
  "trl>=0.12.0,<0.13.0",
  "peft>=0.13.0,<0.17.0",
  "bitsandbytes>=0.43.0,<0.46.0",
  "accelerate>=0.33.0,<1.3.0",
  "datasets>=2.20.0,<4.0.0",
  "sentencepiece>=0.2.0",
  "protobuf>=4.25.0",
  "huggingface_hub>=0.23.0,<1.0.0",
  "safetensors>=0.4.0",
  "tokenizers>=0.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
layer-router-train = "app.train.main:main"
layer-router-dpo = "app.train.main:main"
train-dpo = "app.train.train_dpo:main"
train-sft = "app.train.train_sft:main"
export-merge = "app.train.export_merge:main"
router-eval = "app.eval.cli:main"
router-build = "app.build.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["app.tests*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
